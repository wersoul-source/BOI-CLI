<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1130" width="1100" height="1130" font-family="'Noto Sans Thai','Noto Sans','Segoe UI',Tahoma,sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b7791f"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #1f2328; }
      .sub { font-size: 15px; fill: #57606a; }
      .h { font-size: 18px; font-weight: 700; fill: #1f2328; }
      .t { font-size: 15px; fill: #1f2328; }
      .m { font-size: 13.5px; fill: #57606a; }
      .code { font-family: 'JetBrains Mono','Consolas',monospace; font-size: 14px; fill: #1f2328; }
      .phase { font-size: 16px; font-weight: 700; fill: #ffffff; }
      .line { stroke: #57606a; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="1100" height="1130" fill="#fafaf7"/>

  <text x="550" y="48" text-anchor="middle" class="title">BOI Agent Suite v1.5 — ผังการทำงานของ 1 งาน</text>
  <text x="550" y="74" text-anchor="middle" class="sub">จากคำสั่งของผู้ใช้ จนได้ผลงานพร้อม manifest</text>

  <!-- 1. Entry -->
  <rect x="120" y="105" width="170" height="56" rx="28" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="205" y="139" text-anchor="middle" class="h">ผู้ใช้</text>
  <line x1="292" y1="133" x2="398" y2="133" class="line" marker-end="url(#arrow)"/>
  <rect x="400" y="105" width="250" height="56" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="525" y="131" text-anchor="middle" class="h">TUI</text>
  <text x="525" y="151" text-anchor="middle" class="code">boi</text>
  <rect x="670" y="105" width="250" height="56" rx="10" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <text x="795" y="131" text-anchor="middle" class="h">CLI</text>
  <text x="795" y="151" text-anchor="middle" class="code">boi ask</text>
  <path d="M525,161 L525,180 L660,180 L660,202" class="line" marker-end="url(#arrow)"/>
  <path d="M795,161 L795,180 L660,180" class="line"/>

  <!-- 2. Composition root -->
  <rect x="110" y="205" width="880" height="190" rx="12" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="140" y="238" class="code" font-weight="700" font-size="17">app.BuildAgent</text>
  <text x="300" y="238" class="m">ประกอบครั้งเดียวตอนเริ่ม · จุดเดียวที่ต่อ Block เข้ากับแกน</text>

  <rect x="140" y="258" width="380" height="36" rx="8" fill="#e6f4f1" stroke="#0f8a7a"/>
  <text x="156" y="282" class="t">Provider ที่ผ่าน qualify</text>
  <line x1="522" y1="276" x2="648" y2="276" class="line" marker-end="url(#arrow)"/>
  <rect x="650" y="258" width="300" height="36" rx="8" fill="#e8eefb" stroke="#2f5bd3"/>
  <text x="666" y="282" class="code">Router</text>

  <rect x="140" y="302" width="380" height="36" rx="8" fill="#e6f4f1" stroke="#0f8a7a"/>
  <text x="156" y="326" class="t">Tool ใน Equipment</text>
  <line x1="522" y1="320" x2="648" y2="320" class="line" marker-end="url(#arrow)"/>
  <rect x="650" y="302" width="300" height="36" rx="8" fill="#e8eefb" stroke="#2f5bd3"/>
  <text x="666" y="326" class="code">Broker.Register</text>

  <rect x="140" y="346" width="380" height="36" rx="8" fill="#e6f4f1" stroke="#0f8a7a"/>
  <text x="156" y="370" class="t">memory, agent-folder</text>
  <line x1="522" y1="364" x2="648" y2="364" class="line" marker-end="url(#arrow)"/>
  <rect x="650" y="346" width="300" height="36" rx="8" fill="#e8eefb" stroke="#2f5bd3"/>
  <text x="666" y="370" class="t">เสียบผ่าน port</text>

  <line x1="550" y1="395" x2="550" y2="428" class="line" marker-end="url(#arrow)"/>

  <!-- 3. Task selection -->
  <rect x="250" y="430" width="600" height="58" rx="10" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="550" y="456" text-anchor="middle" class="code" font-weight="700" font-size="16">PrepareTask</text>
  <text x="550" y="478" text-anchor="middle" class="m">Core เลือก Tool ≤ 15 และ Skill ≤ 15 สำหรับงานนี้</text>

  <line x1="550" y1="488" x2="550" y2="528" class="line" marker-end="url(#arrow)"/>

  <!-- 4. Runtime -->
  <rect x="40" y="530" width="1020" height="350" rx="14" fill="#f2f5fd" stroke="#2f5bd3" stroke-width="2"/>
  <text x="64" y="562" class="h" fill="#2f5bd3">Runtime · แกนตายตัว</text>
  <text x="262" y="562" class="m">ทุกขั้นมีเพดาน: จำนวนก้าว, token, เวลา, การลองใหม่</text>

  <!-- recover loop -->
  <path d="M937,625 L937,598 L267,598 L267,622" fill="none" stroke="#2f5bd3" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="602" y="590" text-anchor="middle" class="m" fill="#2f5bd3">ลองใหม่หรือปรับแผน (จำกัดจำนวนครั้ง)</text>

  <g>
    <rect x="62" y="625" width="140" height="52" rx="10" fill="#2f5bd3"/>
    <text x="132" y="657" text-anchor="middle" class="phase">Observe</text>
    <rect x="227" y="625" width="140" height="52" rx="10" fill="#2f5bd3"/>
    <text x="297" y="657" text-anchor="middle" class="phase">Decide</text>
    <rect x="392" y="625" width="140" height="52" rx="10" fill="#b7791f"/>
    <text x="462" y="657" text-anchor="middle" class="phase">Authorize</text>
    <rect x="557" y="625" width="140" height="52" rx="10" fill="#0f8a7a"/>
    <text x="627" y="657" text-anchor="middle" class="phase">Act</text>
    <rect x="722" y="625" width="140" height="52" rx="10" fill="#0f8a7a"/>
    <text x="792" y="657" text-anchor="middle" class="phase">Verify</text>
    <rect x="887" y="625" width="150" height="52" rx="10" fill="#2f5bd3"/>
    <text x="962" y="657" text-anchor="middle" class="phase">Recover</text>
  </g>
  <line x1="202" y1="651" x2="224" y2="651" class="line" marker-end="url(#arrow)"/>
  <line x1="367" y1="651" x2="389" y2="651" class="line" marker-end="url(#arrow)"/>
  <line x1="532" y1="651" x2="554" y2="651" class="line" marker-end="url(#arrow)"/>
  <line x1="697" y1="651" x2="719" y2="651" class="line" marker-end="url(#arrow)"/>
  <line x1="862" y1="651" x2="884" y2="651" class="line" marker-end="url(#arrow)"/>

  <!-- captions -->
  <text x="132" y="706" text-anchor="middle" class="m">อ่านงาน</text>
  <text x="132" y="726" text-anchor="middle" class="m">และ context</text>

  <text x="297" y="706" text-anchor="middle" class="m">Model เสนอ</text>
  <text x="297" y="726" text-anchor="middle" class="m">Tool ทีละ 1 ตัว</text>
  <text x="297" y="746" text-anchor="middle" class="m">(กำหนดความเสี่ยงเองไม่ได้)</text>

  <rect x="384" y="690" width="156" height="170" rx="8" fill="#fdf4e3" stroke="#b7791f"/>
  <text x="462" y="713" text-anchor="middle" class="t" font-weight="700">อ่าน</text>
  <text x="462" y="733" text-anchor="middle" class="m">ผ่านอัตโนมัติ</text>
  <line x1="398" y1="745" x2="526" y2="745" stroke="#e5c88f"/>
  <text x="462" y="766" text-anchor="middle" class="t" font-weight="700">เขียน / รัน / MCP</text>
  <text x="462" y="786" text-anchor="middle" class="m">ถามผู้ใช้</text>
  <text x="462" y="806" text-anchor="middle" class="code" font-size="13">A · R · Esc</text>
  <line x1="398" y1="818" x2="526" y2="818" stroke="#e5c88f"/>
  <text x="462" y="840" text-anchor="middle" class="m">ไม่โต้ตอบ: ปฏิเสธ</text>

  <text x="627" y="706" text-anchor="middle" class="m">Tool ทำงาน</text>
  <text x="627" y="726" text-anchor="middle" class="m">ภายใน workspace</text>

  <text x="792" y="706" text-anchor="middle" class="m">Tool ตรวจผลตัวเอง</text>
  <text x="792" y="726" text-anchor="middle" class="m">เช่น อ่านไฟล์ที่เขียน</text>
  <text x="792" y="746" text-anchor="middle" class="m">กลับมาเทียบ</text>

  <text x="962" y="706" text-anchor="middle" class="m">เกิดข้อผิดพลาด</text>
  <text x="962" y="726" text-anchor="middle" class="m">ตัดสินว่าลองใหม่</text>
  <text x="962" y="746" text-anchor="middle" class="m">หรือหยุด</text>

  <!-- 5. Outcomes -->
  <path d="M550,880 L550,915 L300,915 L300,948" class="line" marker-end="url(#arrow)"/>
  <path d="M550,915 L800,915 L800,948" class="line" marker-end="url(#arrow)"/>

  <rect x="80" y="950" width="440" height="84" rx="12" fill="#e7f5ec" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="300" y="980" text-anchor="middle" class="h" fill="#1a7f37">สำเร็จ</text>
  <text x="300" y="1012" text-anchor="middle" class="code">agent-folder/output/&lt;task&gt;/manifest.json</text>

  <rect x="580" y="950" width="440" height="84" rx="12" fill="#fbeceb" stroke="#b42318" stroke-width="1.5"/>
  <text x="800" y="980" text-anchor="middle" class="h" fill="#b42318">ล้มเหลว / ยกเลิก</text>
  <text x="800" y="1012" text-anchor="middle" class="code">agent-folder/bin/&lt;task&gt;/</text>

  <!-- legend -->
  <g transform="translate(150,1074)">
    <rect width="18" height="18" rx="4" fill="#2f5bd3"/>
    <text x="28" y="14" class="m">แกนตายตัว (Core + Runtime)</text>
    <rect x="270" width="18" height="18" rx="4" fill="#0f8a7a"/>
    <text x="298" y="14" class="m">Block ที่ถอดประกอบได้</text>
    <rect x="500" width="18" height="18" rx="4" fill="#b7791f"/>
    <text x="528" y="14" class="m">จุดที่ผู้ใช้เป็นคนอนุมัติ</text>
  </g>
</svg>

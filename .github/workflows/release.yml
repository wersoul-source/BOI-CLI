name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The same gates as every pull request: format, vet, race tests with the
  # coverage floor, staticcheck, the built-binary acceptance, govulncheck and
  # the cross-compile checks. A tag on a commit that fails any of them does
  # not produce a release.
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

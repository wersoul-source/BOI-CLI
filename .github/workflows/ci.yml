name: CI

on: [push, pull_request]

# Linux is the release gate. Other platforms are compile checks only until
# Linux passes on a real machine (docs/architecture/BLOCK_ARCHITECTURE.md).
jobs:
  linux:
    name: Linux (test, race, lint, coverage, acceptance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet
        run: go vet ./...
      - name: Test with race detector and coverage
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Coverage gate
        env:
          MIN_COVERAGE: '55'
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}% (minimum ${MIN_COVERAGE}%)"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit (t+0 < m+0) }'
      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Built-binary folder simulation
        run: |
          CGO_ENABLED=0 go build -trimpath -o boi ./cmd/boi
          python3 -I scripts/acceptance/linux_folder_simulation.py ./boi

  cross-compile:
    name: Compile check (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: android, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./cmd/boi

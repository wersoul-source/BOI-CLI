version: 2

builds:
  - id: boi
    main: ./cmd/boi
    binary: boi
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/boi-family/boi-cli/internal/cli.Version={{.Version}}

archives:
  - format: tar.gz
    name_template: >-
      boi_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
      - scripts/install.sh
      - scripts/install.ps1

checksum:
  name_template: checksums.txt

source:
  enabled: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  github:
    owner: wersoul-source
    name: BOI-CLI
